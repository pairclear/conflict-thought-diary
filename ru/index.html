<!doctype html>
<html lang="ru" data-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1714'/%3E%3Ccircle cx='12' cy='16' r='4.5' fill='%23c0613f'/%3E%3Ccircle cx='20' cy='16' r='4.5' fill='none' stroke='%23c0613f' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf7f2; --card:#f2ede5; --field:#ffffff; --ink:#1a1714; --muted:#6b645c; --line:#e4ddd2;
  --accent:#b85c3c; --accent-soft:#f3e2d9; --btn:#1a1714; --btn-ink:#faf7f2; --focus:#b85c3c;
  --serif:"Iowan Old Style","Charter","Georgia","Cambria","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --card:#211e19; --field:#1b1814; --ink:#efe9df; --muted:#a39b8f; --line:#332e27;
    --accent:#d9774f; --accent-soft:#3a271e; --btn:#efe9df; --btn-ink:#15130f;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --card:#211e19; --field:#1b1814; --ink:#efe9df; --muted:#a39b8f; --line:#332e27;
  --accent:#d9774f; --accent-soft:#3a271e; --btn:#efe9df; --btn-ink:#15130f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;text-decoration:none}
.mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--ink)}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:14px;background:none;border:1px solid transparent;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--card)}
main{padding:40px 0 56px;min-height:60vh}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0}
h1{font-size:clamp(36px,6vw,56px)}
h2{font-size:clamp(26px,4vw,34px)}
h3{font-size:20px}
.lead{font-size:19px;color:var(--ink);max-width:620px;margin:18px 0 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr;gap:28px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:40px;margin:0 0 14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
label.lbl{display:block;font-weight:600;margin:28px 0 8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;transition:border-color .15s, box-shadow .15s}
input[type=text]:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:inherit;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:15px;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.btn{font:inherit;font-weight:600;font-size:16px;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);padding:12px 20px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.link{background:none;border:none;padding:12px 4px;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.chip:focus-visible,.langs button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.note{border-left:3px solid var(--accent);background:var(--card);padding:14px 18px;border-radius:0 10px 10px 0;font-size:15px}
.note.warn{border-left-color:#c2410c}
.danger{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;margin-top:22px;font-size:15px}
.danger b{display:block;margin-bottom:4px}
/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.prog .dots{display:flex;gap:6px;align-items:center}
.prog .dot{width:26px;height:26px;border-radius:999px;border:1px solid var(--line);font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.prog .dot.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog .dot.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.narrow{max-width:720px}
.hint{font-size:15px;color:var(--muted);margin:6px 0 0}
.qs{margin:10px 0 0;padding-left:22px;color:var(--muted);font-size:15px}
.qs li{margin-bottom:6px}
input[type=date]{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
/* sliders */
.rate{display:grid;grid-template-columns:minmax(120px,180px) 1fr 52px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rate:last-child{border-bottom:none}
.rate .nm{font-weight:600}
.rate .val{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.rate .was{font-size:13px;color:var(--muted);white-space:nowrap}
.rate .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px 6px}
@media (max-width:560px){.rate{grid-template-columns:1fr 52px auto}.rate input[type=range]{grid-column:1 / -1;grid-row:2}}
input[type=range]{width:100%;accent-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.addrow{display:flex;gap:8px;margin-top:12px;max-width:420px}
.addrow input{flex:1}
/* traps */
.traps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
@media (max-width:820px){.traps{grid-template-columns:1fr}}
.trap{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.trap input{margin-top:6px;accent-color:var(--accent)}
.trap.on{border-color:var(--accent)}
.trap .tn{font-weight:600}
.trap .td{font-size:15px;margin-top:2px}
.trap .te{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.trapref{display:grid;gap:14px;margin-top:26px}
.trapref .card h3{margin-bottom:6px}
.trapref .card p{margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
/* entries */
.entries{display:grid;gap:10px;margin-top:16px}
.entry{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.entry:hover{border-color:var(--accent)}
.entry .d{font-size:13px;color:var(--muted)}
.entry .h{font-family:var(--serif);font-size:19px;margin-top:2px}
.entry .e{font-size:14px;color:var(--muted);margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tools .btn{font-size:14px;padding:8px 14px}
.btn.danger-btn{color:var(--accent);border-color:var(--line);background:transparent}
section.block{margin-top:44px}
/* summary */
.sum{margin-top:24px;display:grid;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum .it{padding:14px 20px;border-bottom:1px solid var(--line)}
.sum .it:last-child{border-bottom:none}
.sum .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sum .v{white-space:pre-wrap;margin-top:4px;word-break:break-word}
.sum .it.hot .v{font-family:var(--serif);font-size:22px;line-height:1.3}
.sum .it.bal .v{font-family:var(--serif);font-size:20px;line-height:1.35;color:var(--accent)}
.bars{display:grid;gap:6px;margin-top:6px}
.bar{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:10px;align-items:center;font-size:15px}
.bar .tr{position:relative;height:10px;border-radius:6px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--line)}
.bar .tr b{position:absolute;left:0;top:2px;bottom:2px;background:var(--accent);border-radius:4px}
.bar .n{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* footer */
footer{border-top:1px solid var(--line);padding:36px 0 48px;font-size:15px;color:var(--muted)}
footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:820px){footer .cols{grid-template-columns:1fr}}
footer h3{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);margin-bottom:8px}
footer p{margin:0 0 10px}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{max-width:720px}
.err{color:var(--accent);font-size:14px;min-height:20px;margin-top:10px}
/* printable blank sheet */
#sheet{display:none}
.sheet h2{font-size:24px;margin-bottom:4px}
.sheet .box{border:1px solid #999;border-radius:6px;padding:8px 10px;margin-top:10px;break-inside:avoid}
.sheet .box b{font-size:13px}
.sheet .box small{display:block;color:#555;font-size:11px}
.sheet .tall{min-height:90px}.sheet .mid{min-height:60px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .traplist{font-size:11px;columns:2;margin:4px 0 0;padding-left:0;list-style:none}
@media print{
  header.top,.actions,.langs,.tools,.btn,.chips,footer,.no-print{display:none!important}
  body{background:#fff;color:#000;font-size:13px}
  main{padding:0}
  .sum{border:none}
  body.pblank main{display:none}
  body.pblank #sheet{display:block}
}

    m1: "The thought record is a standard worksheet in cognitive behavioural therapy (CBT), which grew out of Aaron Beck's cognitive therapy in the 1960s and 1970s. The idea is that how we feel depends not only on an event but also on what we tell ourselves about it. Writing a thought down and checking it against the facts makes it easier to see from a distance.",
    m2: "This page uses our own wording and adapts the record to conflicts with a partner. CBT delivered by trained professionals has a large evidence base, but this particular page has not been studied, so we make no claims about its effect.",
    m3: "It is not couples therapy and not a way to decide who is right. If arguments keep repeating, get worse, or you feel afraid, talk to a psychologist or couples therapist.",
    md_title: "Thoughts after a fight",
    md_footer: "\"Thoughts after a fight\" diary by PairClear: https://pairclear.github.io/conflict-thought-diary/",
    csv_head: ["date", "what happened", "thoughts", "hot thought", "belief before", "belief after", "feelings (before→after)", "traps", "facts for", "facts against", "other explanations", "balanced thought", "what I need", "first sentence"],
    sheet_h: "Thoughts after a fight: worksheet",
    sheet_sub: "Self-reflection, not diagnosis or therapy. If you feel unsafe: 112 / 911 / findahelpline.com",
    sheet_traps: "Traps",
    prompt: (md) =>
`Help me sort out my thoughts after an argument with my partner. I filled in a thought record (a CBT-style worksheet). Here is what I wrote:

${md}

How to help me:
- Keep messages short and calm. Ask one question at a time and wait for my answer.
- First, in two or three sentences, reflect back what you heard and what I seem to feel. Don't rush to solutions.
- Then help me check the hot thought: what is fact and what is interpretation, which thinking traps may be there, what else could be true. Offer your observations as guesses and ask whether they fit.
- Help me put into words what I need and, if I want, a calm first sentence for a talk with my partner.

Rules for you:
- My feelings are not wrong. The aim is to see the thought more clearly, not to prove I am wrong and not to excuse my partner.
- Do not diagnose or label me or my partner (no "narcissist", "toxic", "codependent", "abuser" as a conclusion). You only hear one side: talk about specific actions, not about what kind of person someone is.
- Do not advise me to leave or stay in the relationship.
- This is self-reflection, not therapy. If arguments repeat or escalate, you can suggest a psychologist or couples therapist.
- If I mention that my partner hurts, threatens or controls me, or that I am afraid of them, stop: fear in that situation is not a thinking trap. Suggest contacting emergency services (112, 911 or the local number) or a domestic violence helpline (findahelpline.com).
- If I mention thoughts of self-harm or suicide, stop, say this matters more, and suggest contacting emergency services or a free helpline (findahelpline.com) right now. Go back to the diary only if I ask.

Start by reflecting back what you heard, then ask your first question.`,
    traps: [
      { k: "mind", n: "Mind reading", d: "You feel sure you know what your partner thinks or feels, though they did not say it.", ex: "\"He's quiet, so he's angry with me\"", q: "What exactly did they say or do? Could I ask?" },
      { k: "fortune", n: "Fortune telling", d: "A bad outcome feels already decided.", ex: "\"We'll fight again and it will end in a breakup\"", q: "How often have my predictions come true exactly?" },
      { k: "catastrophe", n: "Catastrophising", d: "An unpleasant event feels like a disaster that can't be repaired.", ex: "\"That's it, the relationship is ruined\"", q: "What is the most likely outcome, not the worst one?" },
      { k: "always", n: "Always and never", d: "One event turns into a rule.", ex: "\"You never listen to me\"", q: "Were there times it was different?" },
      { k: "label", n: "Labelling", d: "A verdict on the person instead of a description of the action.", ex: "\"Selfish\", \"toxic\", \"narcissist\"", q: "Which specific action hurt me?" },
      { k: "personal", n: "Taking it personally", d: "Your partner's mood or action feels like a response to you.", ex: "\"They're in a bad mood, so I must have done something wrong\"", q: "What other reasons could there be for their mood?" },
      { k: "blame", n: "All on one person", d: "The whole fight is put on one person: your partner or you.", ex: "\"It's all their fault\" or \"It's all me\"", q: "Which part is mine, and which is theirs?" },
      { k: "should", n: "Shoulds", d: "Rigid rules about how your partner or you \"should\" behave.", ex: "\"If he loved me, he should guess what I need\"", q: "Did I say it out loud?" },
      { k: "emotional", n: "Emotional reasoning", d: "A strong feeling is taken as proof.", ex: "\"I feel abandoned, so I am being abandoned\"", q: "What do the facts say if I set the feeling aside for a minute?" },
      { k: "filter", n: "Mental filter", d: "You notice only the bad part and miss the rest.", ex: "Out of the whole evening you remember only one sharp remark", q: "What else happened that day, that week?" }
    ]
  }
};

/* Words that should surface the safety block. Matched locally, never sent anywhere. */
const DANGER = /(суицид|покончить с собой|убить себя|убью себя|не хочу жить|не хочется жить|навредить себе|порезать себя|самоповрежд|ударил|ударила|бьёт меня|бьет меня|избил|избила|душил|душила|угрожает|угрожал|угрожала|боюсь его|боюсь её|боюсь ее|насили|suicid|kill myself|end my life|want to die|don'?t want to live|self[- ]harm|hurt myself|cut myself|hit me|hits me|beat me|beats me|punched me|choked me|strangled|threaten|afraid of (him|her|them)|scared of (him|her|them)|abus)/i;

let lang = "ru";
let S;
const blankDraft = () => ({ id: null, date: today(), situation: "", thoughts: "", hot: "", beliefBefore: 70, beliefAfter: null,
  emotions: [], traps: [], evFor: "", evAgainst: "", other: "", balanced: "", need: "", say: "" });
const blankState = () => ({ view: "home", step: 0, draft: null, entries: [], openId: null });

function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} },
  del(){ try { localStorage.removeItem(KEY); } catch(e){} }
};
const save = () => store.set({ v: 1, lang, view: S.view, step: S.step, draft: S.draft, entries: S.entries, openId: S.openId });

function pickLang(saved){
  const q = (new URLSearchParams(location.search).get("lang") || document.documentElement.getAttribute("data-lang"));
  if (q === "ru" || q === "en") return q;
  if (saved && (saved.lang === "ru" || saved.lang === "en")) return saved.lang;
  const nav = (navigator.languages || [navigator.language || "en"]).join(",").toLowerCase();
  return /(^|,)(ru|uk|be|kk)/.test(nav) ? "ru" : "en";
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const t = () => T[lang];
const clamp = (n) => Math.max(0, Math.min(100, Math.round(+n || 0)));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const trapName = (k) => { const x = t().traps.find(tr => tr.k === k); return x ? x.n : k; };
const fmtDate = (iso) => { try { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" }); } catch(e){ return iso; } };
const textOf = (e) => [e.situation, e.thoughts, e.hot, e.evFor, e.evAgainst, e.other, e.balanced, e.need, e.say, ...(e.emotions || []).map(x => x.name)].join(" \n ");
const isDanger = (e) => DANGER.test(textOf(e));
const pcUrl = (medium) => (lang === "ru" ? "https://pairclear.com/ru/" : "https://pairclear.com/en/") + "?utm_source=github&utm_medium=" + medium + "&utm_campaign=" + CAMPAIGN;

function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2000); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(_){} ta.remove();
  }
  toast(t().copied);
}
function download(name, text, type){
  const blob = new Blob([text], { type: type + ";charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- text exports ---------- */
function entryMd(e, heading = "##"){
  const L = t(), out = [];
  out.push(heading + " " + L.entry_from + " " + fmtDate(e.date));
  const sec = (k, v) => { if (v && String(v).trim()) out.push("", "**" + L[k] + "**", "", String(v).trim()); };
  sec("sum_situation", e.situation);
  sec("sum_thoughts", e.thoughts);
  sec("sum_hot", e.hot);
  if (e.hot) out.push("", "**" + L.sum_belief + ":** " + e.beliefBefore + (e.beliefAfter != null ? " → " + e.beliefAfter : ""));
  if (e.emotions && e.emotions.length) {
    out.push("", "**" + L.sum_emotions + "**", "");
    e.emotions.forEach(x => out.push("- " + x.name + ": " + x.b + (x.a != null ? " → " + x.a : "")));
  }
  if (e.traps && e.traps.length) out.push("", "**" + L.sum_traps + ":** " + e.traps.map(trapName).join(", "));
  sec("sum_for", e.evFor);
  sec("sum_against", e.evAgainst);
  sec("sum_other", e.other);
  sec("sum_bal", e.balanced);
  sec("sum_need", e.need);
  sec("sum_say", e.say);
  return out.join("\n");
}
function allMd(){
  const L = t();
  return "# " + L.md_title + "\n\n" + S.entries.map(e => entryMd(e)).join("\n\n---\n\n") + "\n\n---\n\n" + L.md_footer + "\n";
}
function csv(){
  const L = t();
  const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = [L.csv_head.map(q).join(",")];
  S.entries.forEach(e => rows.push([e.date, e.situation, e.thoughts, e.hot, e.beliefBefore, e.beliefAfter,
    (e.emotions || []).map(x => x.name + " " + x.b + (x.a != null ? "→" + x.a : "")).join("; "),
    (e.traps || []).map(trapName).join("; "), e.evFor, e.evAgainst, e.other, e.balanced, e.need, e.say].map(q).join(",")));
  return "﻿" + rows.join("\r\n") + "\r\n";
}

/* ---------- static text ---------- */
function applyStatic(){
  document.documentElement.lang = lang;
  $$("[data-i]").forEach(el => {
    const v = t()[el.dataset.i];
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  $$(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#pclink").href = pcUrl("tool");
  document.title = lang === "ru" ? "Мысли после ссоры: дневник мыслей (КПТ) для пары" : "Thoughts after a fight: a CBT thought diary for couples";
}

function progress(k){
  const L = t();
  return `<div class="prog">
    <span class="muted small">${esc(L.step)} ${k + 1} ${esc(L.of)} ${STEPS}</span>
    <span class="dots">${Array.from({ length: STEPS }, (_, i) => `<span class="dot ${i < k ? "done" : i === k ? "on" : ""}">${i + 1}</span>`).join("")}</span>
  </div>`;
}

function rateRow(i, name, val, was){
  return `<div class="rate">
    <span class="nm">${esc(name)}</span>
    <input type="range" min="0" max="100" step="5" value="${val}" data-rate="${i}" aria-label="${esc(name)}">
    <span class="val" data-val="${i}">${val}</span>
    ${was != null ? `<span class="was">${esc(t().was)} ${was}</span>` : `<button type="button" class="x" data-rm="${i}" aria-label="×">×</button>`}
  </div>`;
}

function viewStep(k){
  const L = t(), d = S.draft;
  let h, p, body;
  if (k === 0) {
    h = L.s0_h; p = L.s0_p;
    body = `
      <textarea id="f_situation" data-f="situation" placeholder="${esc(L.s0_ph)}">${esc(d.situation)}</textarea>
      <label class="lbl" for="f_date">${esc(L.date_l)}</label>
      <input type="date" id="f_date" data-f="date" value="${esc(d.date)}" max="${today()}">
      <p class="note warn small" style="margin-top:24px">${esc(L.safe_note)}</p>`;
  } else if (k === 1) {
    h = L.s1_h; p = L.s1_p;
    body = `
      <textarea data-f="thoughts" placeholder="${esc(L.s1_ph)}">${esc(d.thoughts)}</textarea>
      <label class="lbl" for="f_hot">${esc(L.hot_l)}</label>
      <input type="text" id="f_hot" data-f="hot" maxlength="300" placeholder="${esc(L.hot_ph)}" value="${esc(d.hot)}">
      <label class="lbl">${esc(L.belief_l)}</label>
      <div class="rate" style="grid-template-columns:1fr 52px"><input type="range" min="0" max="100" step="5" value="${d.beliefBefore}" data-belief="beliefBefore" aria-label="${esc(L.belief_l)}"><span class="val" data-bval="beliefBefore">${d.beliefBefore}</span></div>`;
  } else if (k === 2) {
    h = L.s2_h; p = L.s2_p;
    const names = d.emotions.map(x => x.name.toLowerCase());
    body = `
      <div class="chips">${L.emos.map(n => `<button type="button" class="chip" data-emo="${esc(n)}" aria-pressed="${names.includes(n) ? "true" : "false"}">${esc(n)}</button>`).join("")}</div>
      <div class="addrow"><input type="text" id="emoNew" maxlength="40" placeholder="${esc(L.emo_add_ph)}"><button type="button" class="btn ghost" data-act="emo-add">${esc(L.emo_add)}</button></div>
      <div class="card" style="margin-top:22px;padding:8px 20px">${d.emotions.length ? d.emotions.map((x, i) => rateRow(i, x.name, x.b, null)).join("") : `<p class="muted small">${esc(L.emo_none)}</p>`}</div>`;
  } else if (k === 3) {
    h = L.s3_h; p = L.s3_p;
    body = `
      ${d.hot.trim() ? `<p class="topicline" style="font-family:var(--serif);font-size:20px;margin:18px 0 0">«${esc(d.hot.trim())}»</p>` : ""}
      <div class="traps">${L.traps.map(tr => `<label class="trap ${d.traps.includes(tr.k) ? "on" : ""}">
        <input type="checkbox" data-trap="${tr.k}" ${d.traps.includes(tr.k) ? "checked" : ""}>
        <span><span class="tn">${esc(tr.n)}</span><div class="td">${esc(tr.d)}</div><div class="te">${esc(tr.ex)}</div></span>
      </label>`).join("")}</div>`;
  } else if (k === 4) {
    h = L.s4_h; p = L.s4_p;
    body = `
      ${d.hot.trim() ? `<p class="topicline" style="font-family:var(--serif);font-size:20px;margin:18px 0 0">«${esc(d.hot.trim())}»</p>` : ""}
      <div class="two">
        <div><label class="lbl" for="f_for">${esc(L.for_l)}</label><textarea id="f_for" data-f="evFor" placeholder="${esc(L.for_ph)}">${esc(d.evFor)}</textarea></div>
        <div><label class="lbl" for="f_against">${esc(L.against_l)}</label><textarea id="f_against" data-f="evAgainst" placeholder="${esc(L.against_ph)}">${esc(d.evAgainst)}</textarea>
        <p class="hint">${esc(L.against_hint)}</p></div>
      </div>`;
  } else if (k === 5) {
    h = L.s5_h; p = L.s5_p;
    body = `
      <ul class="qs">${L.s5_qs.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      <label class="lbl" for="f_other">${esc(L.other_l)}</label>
      <textarea id="f_other" data-f="other" placeholder="${esc(L.other_ph)}">${esc(d.other)}</textarea>
      <label class="lbl" for="f_bal">${esc(L.bal_l)}</label>
      <textarea id="f_bal" data-f="balanced" style="min-height:90px" placeholder="${esc(L.bal_ph)}">${esc(d.balanced)}</textarea>`;
  } else {
    h = L.s6_h; p = L.s6_p;
    if (d.beliefAfter == null) d.beliefAfter = d.beliefBefore;
    d.emotions.forEach(x => { if (x.a == null) x.a = x.b; });
    body = `
      ${d.emotions.length ? `<div class="card" style="margin-top:22px;padding:8px 20px">${d.emotions.map((x, i) => rateRow(i, x.name, x.a, x.b)).join("")}</div>` : ""}
      <label class="lbl">${esc(L.belief_after_l)}${d.hot.trim() ? ` <span class="muted" style="font-weight:400">«${esc(d.hot.trim().slice(0, 100))}»</span>` : ""}</label>
      <div class="rate" style="grid-template-columns:1fr 52px auto"><input type="range" min="0" max="100" step="5" value="${d.beliefAfter}" data-belief="beliefAfter" aria-label="${esc(L.belief_after_l)}"><span class="val" data-bval="beliefAfter">${d.beliefAfter}</span><span class="was">${esc(L.was)} ${d.beliefBefore}</span></div>
      <label class="lbl" for="f_need">${esc(L.need_l)}</label>
      <textarea id="f_need" data-f="need" style="min-height:90px" placeholder="${esc(L.need_ph)}">${esc(d.need)}</textarea>
      <label class="lbl" for="f_say">${esc(L.say_l)}</label>
      <textarea id="f_say" data-f="say" style="min-height:90px" placeholder="${esc(L.say_ph)}">${esc(d.say)}</textarea>
      <p class="hint">${esc(L.say_hint)}</p>`;
  }
  return `
  <div class="narrow">
    ${progress(k)}
    <h2>${esc(h)}</h2>
    <p class="lead" style="font-size:17px">${esc(p)}</p>
    <form id="stepForm" autocomplete="off">
      <div style="margin-top:20px">${body}</div>
      <div id="dangerSlot">${isDanger(d) ? dangerBlock() : ""}</div>

      <div class="row" style="margin-top:14px">
        <button type="button" class="btn ghost" data-act="back">← ${esc(L.back)}</button>
        <button class="btn" type="submit">${esc(k === STEPS - 1 ? L.finish : L.next)} →</button>
      </div>
    </form>
  </div>`;
}

function bars(e){

  return `<div class="bars">${em.map(x => `<div class="bar"><span>${esc(x.name)}</span>

}

function viewEntry(e, justSaved){

      ${it("sum_thoughts", e.thoughts)}
      ${e.hot ? `<div class="it hot"><div class="k">${esc(L.sum_hot)}</div><div class="v">${esc(e.hot)}</div>
        <div class="muted small" style="margin-top:6px">${esc(L.sum_belief)}: ${e.beliefBefore}${e.beliefAfter != null ? " → " + e.beliefAfter : ""}</div></div>` : ""}
      ${(e.emotions || []).length ? `<div class="it"><div class="k">${esc(L.sum_emotions)}</div>${bars(e)}</div>` : ""}
      ${(e.traps || []).length ? `<div class="it"><div class="k">${esc(L.sum_traps)}</div><div class="v">${esc(e.traps.map(trapName).join(", "))}</div></div>` : ""}
      ${it("sum_for", e.evFor)}
      ${it("sum_against", e.evAgainst)}
      ${it("sum_other", e.other)}
      ${it("sum_bal", e.balanced, "bal")}
      ${it("sum_need", e.need)}
      ${it("sum_say", e.say)}
    </div>
    <div class="actions" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:22px">
      <button class="btn" data-act="copy-prompt">${esc(L.copy_prompt)}</button>
      <button class="btn ghost" data-act="copy-md">${esc(L.copy_md)}</button>
      <button class="btn ghost" data-act="dl-md">${esc(L.dl_md)}</button>
      <button class="btn ghost" data-act="print">${esc(L.print)}</button>
      <button class="btn ghost" data-act="edit">${esc(L.edit)}</button>
      <button class="btn danger-btn" data-act="del">${esc(L.del)}</button>
    </div>
    <p class="muted small no-print" style="margin-top:14px">${esc(L.prompt_hint)}</p>
    <div class="actions no-print" style="margin-top:28px">
      <button class="btn" data-act="new">${esc(L.new_entry)} →</button>
    </div>
  </div>`;
}

function viewTraps(){
  const L = t();
  return `
  <div class="narrow">
    <button class="btn link no-print" data-act="home" style="padding-left:0">${esc(L.all_entries)}</button>
    <h1 style="font-size:clamp(32px,5vw,46px);margin-top:8px">${esc(L.traps_h)}</h1>
    <p class="lead" style="font-size:17px">${esc(L.traps_p)}</p>
    <div class="trapref">${L.traps.map(tr => `<div class="card">
      <h3>${esc(tr.n)}</h3>
      <p>${esc(tr.d)}</p>
      <p class="muted"><b>${esc(L.traps_ex)}:</b> ${esc(tr.ex)}</p>
      <p><b>${esc(L.traps_try)}:</b> ${esc(tr.q)}</p>
    </div>`).join("")}</div>
    <div class="row"><button class="btn" data-act="new">${esc(L.new_entry)} →</button></div>
  </div>`;
}

function sheetHTML(){
  const L = t();
  const box = (title, sub, cls) => `<div class="box ${cls}"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
  return `<div class="sheet">
    <h2>${esc(L.sheet_h)}</h2>
    <div style="font-size:11px;color:#555">${esc(L.sheet_sub)} · ${esc(L.date_l)}: ____________</div>
    ${box(L.s0_h, L.s0_p, "tall")}
    ${box(L.s1_h, L.hot_l + " · " + L.belief_l + " ___ /100", "tall")}
    ${box(L.s2_h, L.s2_p, "mid")}
    <div class="box"><b>${esc(L.sheet_traps)}</b><ul class="traplist">${L.traps.map(tr => `<li>☐ ${esc(tr.n)}: ${esc(tr.ex)}</li>`).join("")}</ul></div>
    <div class="row2">${box(L.for_l, "", "tall")}${box(L.against_l, "", "tall")}</div>
    ${box(L.s5_h, L.s5_qs.join(" "), "tall")}
    ${box(L.bal_l, "", "mid")}
    ${box(L.s6_h, L.belief_after_l + " ___ /100", "mid")}
    ${box(L.need_l, L.say_hint, "mid")}
  </div>`;
}

/* ---------- render & events ---------- */
function render(){
  const app = $("#app");
  if (S.view === "step" && S.draft) { app.innerHTML = viewStep(S.step); bindStep(S.step); return; }
  if (S.view === "entry") {
    const e = S.entries.find(x => x.id === S.openId);
    if (e) { app.innerHTML = viewEntry(e, render.justSaved); render.justSaved = false; bindEntry(e); return; }
  }
  if (S.view === "traps") { app.innerHTML = viewTraps(); bindCommon(); return; }
  S.view = "home"; app.innerHTML = viewHome(); bindHome();
}
function go(view, extra = {}){
  Object.assign(S, { view }, extra); save(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
const on = (act, fn) => $$("[data-act=" + act + "]").forEach(el => el.addEventListener("click", fn));
function startNew(){ S.draft = blankDraft(); go("step", { step: 0 }); }
function bindCommon(){
  on("home", () => go("home"));
  on("new", startNew);
}

function bindHome(){
  const L = t();
  bindCommon();
  on("resume", () => { const d = S.draft; const k = !d.situation.trim() ? 0 : !d.hot.trim() ? 1 : Math.min(S.step || 2, STEPS - 1); go("step", { step: k }); });
  on("discard", () => { S.draft = null; save(); render(); });
  on("traps", () => go("traps"));
  $$("[data-open]").forEach(b => b.addEventListener("click", () => go("entry", { openId: b.dataset.open })));
  const stamp = today();
  on("exp-md", () => S.entries.length ? download("thoughts-after-a-fight-" + stamp + ".md", allMd(), "text/markdown") : toast(L.nothing));
  on("exp-csv", () => S.entries.length ? download("thoughts-after-a-fight-" + stamp + ".csv", csv(), "text/csv") : toast(L.nothing));
  on("exp-json", () => S.entries.length ? download("thoughts-after-a-fight-backup-" + stamp + ".json", JSON.stringify({ app: CAMPAIGN, v: 1, entries: S.entries }, null, 2), "application/json") : toast(L.nothing));
  on("imp-json", () => $("#importFile").click());
  on("print-blank", printBlank);
  on("clear", () => {
    if (!confirm(L.clear_q)) return;
    store.del(); S = blankState(); save(); render(); toast(L.cleared);
  });
}

function bindStep(k){
  const L = t(), d = S.draft;
  bindCommon();
  const refreshDanger = () => { const slot = $("#dangerSlot"); const want = isDanger(d); if (want !== !!slot.firstChild) slot.innerHTML = want ? dangerBlock() : ""; };
  $$("[data-f]").forEach(el => el.addEventListener("input", () => {
    d[el.dataset.f] = el.value; $("#err").textContent = ""; save(); refreshDanger();
  }));
  $$("[data-belief]").forEach(el => el.addEventListener("input", () => {
    d[el.dataset.belief] = clamp(el.value); $("[data-bval=" + el.dataset.belief + "]").textContent = d[el.dataset.belief]; save();
  }));
  $$("[data-rate]").forEach(el => el.addEventListener("input", () => {
    const x = d.emotions[+el.dataset.rate]; if (!x) return;
    if (k === 6) x.a = clamp(el.value); else { x.b = clamp(el.value); }
    $("[data-val='" + el.dataset.rate + "']").textContent = clamp(el.value); save();
  }));
  $$("[data-rm]").forEach(el => el.addEventListener("click", () => { d.emotions.splice(+el.dataset.rm, 1); save(); render(); }));
  $$("[data-emo]").forEach(el => el.addEventListener("click", () => {
    const n = el.dataset.emo, i = d.emotions.findIndex(x => x.name.toLowerCase() === n.toLowerCase());
    if (i >= 0) d.emotions.splice(i, 1); else d.emotions.push({ name: n, b: 50, a: null });
    save(); render();
  }));
  const addCustom = () => {
    const inp = $("#emoNew"); const n = inp.value.trim(); if (!n) return;
    if (!d.emotions.some(x => x.name.toLowerCase() === n.toLowerCase())) d.emotions.push({ name: n, b: 50, a: null });
    save(); render(); const ni = $("#emoNew"); if (ni) ni.focus();
  };
  on("emo-add", addCustom);
  const en = $("#emoNew"); if (en) en.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addCustom(); } });
  $$("[data-trap]").forEach(el => el.addEventListener("change", () => {
    const key = el.dataset.trap;
    d.traps = el.checked ? [...new Set([...d.traps, key])] : d.traps.filter(x => x !== key);
    el.closest(".trap").classList.toggle("on", el.checked); save();
  }));
  on("back", () => { if (k === 0) go(d.id ? "entry" : "home"); else go("step", { step: k - 1 }); });
  $("#stepForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if (k === 0 && !d.situation.trim()) { $("#err").textContent = L.req_situation; $("#f_situation").focus(); return; }
    if (k === 1 && !d.hot.trim()) { $("#err").textContent = L.req_hot; $("#f_hot").focus(); return; }
    if (k < STEPS - 1) { go("step", { step: k + 1 }); return; }
    finish();
  });
  if (k === 0 && !d.situation) setTimeout(() => { const f = $("#f_situation"); if (f) f.focus({ preventScroll: true }); }, 50);
}

function finish(){
  const d = S.draft;
  ["situation", "thoughts", "hot", "evFor", "evAgainst", "other", "balanced", "need", "say"].forEach(k => d[k] = String(d[k] || "").trim());
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) d.date = today();
  if (d.id) { const i = S.entries.findIndex(x => x.id === d.id); if (i >= 0) S.entries[i] = d; else S.entries.push(d); }
  else { d.id = uid(); S.entries.push(d); }
  const id = d.id; S.draft = null; render.justSaved = true;
  go("entry", { openId: id });
}

function bindEntry(e){
  const L = t();
  bindCommon();
  const md = () => entryMd(e, "#") + "\n\n— " + L.md_footer;
  on("copy-md", () => copy(md()));
  on("dl-md", () => download("thoughts-after-a-fight-" + e.date + ".md", md() + "\n", "text/markdown"));
  on("copy-prompt", () => copy(L.prompt(entryMd(e, "###"))));
  on("print", () => window.print());
  on("edit", () => { S.draft = JSON.parse(JSON.stringify(e)); go("step", { step: 0 }); });
  on("del", () => {
    if (!confirm(L.del_q)) return;
    S.entries = S.entries.filter(x => x.id !== e.id); toast(L.deleted); go("home", { openId: null });
  });
}

function printBlank(){
  $("#sheet").innerHTML = sheetHTML();
  document.body.classList.add("pblank");
  const done = () => { document.body.classList.remove("pblank"); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print();
  setTimeout(done, 1500);
}

$("#importFile").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const arr = Array.isArray(data) ? data : data.entries;
      if (!Array.isArray(arr)) throw 0;
      const ok = arr.map(sanitize).filter(Boolean);
      if (!ok.length) throw 0;
      ok.forEach(x => { const i = S.entries.findIndex(y => y.id === x.id); if (i >= 0) S.entries[i] = x; else S.entries.push(x); });
      save(); render(); toast(t().imported(ok.length));
    } catch(e){ toast(t().import_bad); }
    ev.target.value = "";
  };
  r.readAsText(f);
});

function sanitize(x, isDraft){
  if (!x || typeof x !== "object") return null;
  const s = (v) => String(v == null ? "" : v);
  const e = { ...blankDraft(), id: s(x.id) || uid(), date: /^\d{4}-\d{2}-\d{2}$/.test(x.date) ? x.date : today(),
    situation: s(x.situation), thoughts: s(x.thoughts), hot: s(x.hot),
    beliefBefore: clamp(x.beliefBefore), beliefAfter: x.beliefAfter == null ? null : clamp(x.beliefAfter),
    emotions: Array.isArray(x.emotions) ? x.emotions.filter(y => y && y.name).map(y => ({ name: s(y.name).slice(0, 40), b: clamp(y.b), a: y.a == null ? null : clamp(y.a) })) : [],
    traps: Array.isArray(x.traps) ? x.traps.map(s).filter(k => T.en.traps.some(tr => tr.k === k)) : [],
    evFor: s(x.evFor), evAgainst: s(x.evAgainst), other: s(x.other), balanced: s(x.balanced), need: s(x.need), say: s(x.say) };
  if (isDraft) e.id = x.id ? s(x.id) : null;
  return (isDraft || e.situation || e.hot) ? e : null;
}

$$(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; save(); applyStatic(); render();
}));
$("#home").addEventListener("click", (e) => { e.preventDefault(); if (S.view !== "home") go("home"); });

/* boot */
const saved = store.get();
lang = pickLang(saved);
S = blankState();
if (saved && saved.v === 1) {
  S.entries = Array.isArray(saved.entries) ? saved.entries.map(sanitize).filter(Boolean) : [];
  if (saved.draft) S.draft = sanitize(saved.draft, true);
  S.view = ["home", "step", "entry", "traps"].includes(saved.view) ? saved.view : "home";
  S.step = Math.max(0, Math.min(STEPS - 1, +saved.step || 0));
  S.openId = saved.openId || null;
  if (S.view === "step" && !S.draft) S.view = "home";
}
if (new URLSearchParams(location.search).get("view") === "traps") S.view = "traps";
applyStatic();
render();
})();
</script>
</body>
</html>
